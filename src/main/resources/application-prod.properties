# ==============================================================================
# PERFIL DE PRODUÇÃO (SPRING_PROFILES_ACTIVE=prod)
# ==============================================================================
# Em produção, a documentação Swagger UI e os endpoints OpenAPI ficam desabilitados
# por padrão para evitar a exposição pública de contratos e rotas internas no deploy do cliente.
# Caso seja necessário habilitar para testes temporários em produção, defina:
# SPRINGDOC_API_DOCS_ENABLED=true e SPRINGDOC_SWAGGER_UI_ENABLED=true
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# Garante que detalhes de saúde do Actuator nunca sejam expostos em produção
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
