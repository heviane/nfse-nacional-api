# ==============================================================================
# IDENTIFICAÇÃO E CONTEXTO DA APLICAÇÃO
# ==============================================================================
spring.application.name=nfse-nacional-api
server.port=8080
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:}
server.forward-headers-strategy=framework

# ==============================================================================
# ENCODING & INTERNACIONALIZAÇÃO
# ==============================================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ==============================================================================
# ACTUATOR & MONITORAMENTO DE SAÚDE
# ==============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==============================================================================
# LOGGING & OBSERVABILIDADE
# ==============================================================================
logging.level.root=INFO
logging.level.br.com.heviane.nfse=DEBUG
logging.pattern.level=%5p [%X{correlationId:-sistema}]

# ==============================================================================
# CONFIGURAÇÕES DO AMBIENTE FISCAL SEFIN NACIONAL
# ==============================================================================
nfse.environment=${NFSE_ENVIRONMENT:HOMOLOGACAO}


