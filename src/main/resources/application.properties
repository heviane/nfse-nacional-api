# ==============================================================================
# IDENTIFICAÇÃO E CONTEXTO DA APLICAÇÃO
# ==============================================================================
spring.application.name=nfse-nacional-api
server.port=8080
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:}
server.forward-headers-strategy=framework

# ==============================================================================
# ENCODING & INTERNACIONALIZAÇÃO
# ==============================================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ==============================================================================
# ACTUATOR & MONITORAMENTO DE SAÚDE
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}

# ==============================================================================
# LOGGING & OBSERVABILIDADE
# ==============================================================================
logging.level.root=INFO
logging.level.br.com.heviane.nfse=DEBUG
logging.level.audit.fiscal=INFO
logging.pattern.level=%5p [%X{correlationId:-sistema}]
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{correlationId:-sistema}] %logger{36} : %msg%n

# ==============================================================================
# CONFIGURAÇÕES DO AMBIENTE FISCAL SEFIN NACIONAL, CERTIFICADO A1 & TRUSTSTORE
# ==============================================================================
nfse.environment=${NFSE_ENVIRONMENT:HOMOLOGACAO}
nfse.cert.allow-headers=${NFSE_ALLOW_CERT_HEADERS:false}
nfse.cert.path=${NFSE_CERT_PATH:}
nfse.cert.base64=${NFSE_CERT_BASE64:}
nfse.cert.password=${NFSE_CERT_PASSWORD:}
nfse.truststore.path=${NFSE_TRUSTSTORE_PATH:}
nfse.truststore.password=${NFSE_TRUSTSTORE_PASSWORD:}
nfse.truststore.type=${NFSE_TRUSTSTORE_TYPE:JKS}

# ==============================================================================
# AUDITORIA FISCAL DURÁVEL & HISTÓRICO LOCAL
# ==============================================================================
nfse.audit.dir=${NFSE_AUDIT_LOG_DIR:./logs}
nfse.audit.file-enabled=${NFSE_AUDIT_FILE_ENABLED:true}


