# ==============================================================================
# IDENTIFICAÇÃO E CONTEXTO DA APLICAÇÃO
# ==============================================================================
spring.application.name=nfse-nacional-api
server.port=8080
server.servlet.context-path=/nfse-nacional-api

# ==============================================================================
# ENCODING & INTERNACIONALIZAÇÃO
# ==============================================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ==============================================================================
# ACTUATOR & MONITORAMENTO DE SAÚDE
# ==============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==============================================================================
# LOGGING
# ==============================================================================
logging.level.root=INFO
logging.level.br.com.heviane.nfse=DEBUG

